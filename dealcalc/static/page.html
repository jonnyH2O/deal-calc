<!DOCTYPE html>
<!--
  Calculator Page: shows the calculator in the browser and sends every input change to the Page Host.
  Owner: Ben Horrisberger (Project Plan M11, M12). Skeleton: Jonny Heinrich.
  Design: SDS Section 4.7 and Figure 3. Requirements: R6 to R13, R15, R16.
  The page does no math. Its text comes from GET /text, and the rows are built by page.js.
  Explanations start hidden. Each section and item has an info button that shows its own explanation.
  The "Load reports" window sends property reports to POST /read-reports (not yet in the SDS).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deal Calculator</title>
  <link rel="stylesheet" href="/page.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Deal Calculator</h1>
      <p id="page-purpose"></p>
      <p id="info-hint"></p>
    </div>
    <div class="controls">
      <div class="mode-switch" role="group" aria-label="Mode">
        <button type="button" id="mode-single" aria-pressed="true">Single property</button>
        <button type="button" id="mode-comparison" aria-pressed="false">Compare two</button>
      </div>
      <button type="button" id="load-reports" aria-haspopup="dialog">Load reports</button>
      <button type="button" id="sample-deal">Try a sample deal</button>
    </div>
  </header>

  <p id="connection-problem" class="problem" role="alert" hidden></p>

  <section id="comparison" class="comparison-only explainable" aria-labelledby="comparison-heading">
    <h2 id="comparison-heading">Comparison
      <button type="button" class="info" data-explains="comparison" aria-expanded="false"
              aria-controls="comparison-purpose" aria-label="Explain the Comparison section">i</button>
    </h2>
    <p class="explanation" id="comparison-purpose"></p>
    <p class="note" id="cap-rate-note"></p>
    <p class="problem" id="deltas-message" hidden></p>
  </section>

  <table id="calculator">
    <thead>
      <tr>
        <th scope="col"><span class="visually-hidden">Item</span></th>
        <th scope="col">Property A<span class="source" id="source-A"></span></th>
        <th scope="col" class="comparison-only">Property B<span class="source" id="source-B"></span></th>
        <th scope="col" class="comparison-only">Delta (B &minus; A)</th>
      </tr>
    </thead>
    <tbody id="inputs">
      <tr class="section-row explainable" id="inputs-section">
        <th colspan="4" scope="colgroup">
          <h2>Inputs
            <button type="button" class="info" data-explains="inputs-section" aria-expanded="false"
                    aria-controls="inputs-purpose" aria-label="Explain the Inputs section">i</button>
          </h2>
          <p class="explanation" id="inputs-purpose"></p>
        </th>
      </tr>
    </tbody>
    <tbody id="results">
      <tr class="section-row explainable" id="results-section">
        <th colspan="4" scope="colgroup">
          <h2>Results
            <button type="button" class="info" data-explains="results-section" aria-expanded="false"
                    aria-controls="results-purpose" aria-label="Explain the Results section">i</button>
          </h2>
          <p class="explanation" id="results-purpose"></p>
        </th>
      </tr>
    </tbody>
  </table>

  <dialog id="report-dialog" aria-labelledby="report-heading">
    <h2 id="report-heading">Load property reports</h2>
    <p id="reports-purpose"></p>
    <div class="report-slots">
      <fieldset>
        <legend>Property A</legend>
        <label for="report-file-A">Report file</label>
        <input type="file" id="report-file-A" accept=".pdf,.docx,.txt,application/pdf,text/plain">
        <label for="report-text-A">or paste its text</label>
        <textarea id="report-text-A" rows="3"></textarea>
        <ul class="report-summary" id="report-summary-A" aria-live="polite"></ul>
      </fieldset>
      <fieldset>
        <legend>Property B (optional)</legend>
        <label for="report-file-B">Report file</label>
        <input type="file" id="report-file-B" accept=".pdf,.docx,.txt,application/pdf,text/plain">
        <label for="report-text-B">or paste its text</label>
        <textarea id="report-text-B" rows="3"></textarea>
        <ul class="report-summary" id="report-summary-B" aria-live="polite"></ul>
      </fieldset>
    </div>
    <p class="problem" id="report-problem" role="alert" hidden></p>
    <div class="dialog-buttons">
      <button type="button" id="close-reports">Close</button>
      <button type="button" id="read-reports" class="primary">Read reports</button>
    </div>
  </dialog>

  <script src="/page.js"></script>
</body>
</html>
